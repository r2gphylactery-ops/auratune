name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Show files
        run: dir

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target AuraTune_VST3 AuraTune_Standalone --parallel

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AuraTune-Windows
          path: |
            build/AuraTune_artefacts/Release/VST3/
            build/AuraTune_artefacts/Release/Standalone/
